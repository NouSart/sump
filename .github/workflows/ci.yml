name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: embedding/pyproject.toml

      - name: 安装 embedding 依赖（根 e2e 需要 Python 服务）
        run: pip install ./embedding

      - name: gofmt 检查
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "以下文件需要 gofmt："
            echo "$out"
            exit 1
          fi

      - name: 各模块测试
        run: |
          for m in protocol service settings-center reasoner memory images files qq shell timer; do
            echo "== 模块: $m =="
            (cd "$m" && go test ./... -count=1 -timeout 300s)
          done

      - name: 端到端测试（真进程）
        run: |
          cd tests
          go test ./... -count=1 -timeout 600s

      - name: 脱离工作区构建（GOWORK=off）
        run: |
          for m in protocol service settings-center reasoner memory images files qq shell timer tests; do
            echo "== $m =="
            (cd "$m" && GOWORK=off go build ./...)
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 门户全链路 e2e 需要 Go（起中心 / 记忆 / reasoner 真进程）
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查 + 构建（tsc + vite）
        working-directory: frontend
        run: npm run build

      - name: 测试（协议 / 中心链路 / HTTP API）
        working-directory: frontend
        run: npm test

      # 必须排在 build 之后：这两个 e2e 要门户的构建产物（缺产物时它们会 skip，
      # 所以上面 test 任务里的同名用例是 skip，这里是真跑）
      - name: 门户全链路 e2e（真进程：中心 + 记忆 + reasoner + 门户 + 假 LLM）
        run: go test ./tests -run 'TestPortalChainE2E|TestDeliveryFailureNoticeE2E' -count=1 -timeout 300s

  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: embedding/pyproject.toml

      - name: 安装依赖（核心 + dev；不含 onnx extra——真模型冒烟在 CI 上跳过）
        run: pip install -e "./embedding[dev]"

      - name: 测试（协议锚定 / fake 后端 / 真 WS 集成）
        working-directory: embedding
        run: python -m pytest tests -q
