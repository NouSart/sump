name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: embedding/pyproject.toml

      - name: 安装 embedding 依赖（根 e2e 需要 Python 服务）
        run: pip install ./embedding

      - name: 确认审批测试所需 PowerShell 可用
        run: |
          command -v pwsh
          pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: gofmt 检查
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "以下文件需要 gofmt："
            echo "$out"
            exit 1
          fi

      - name: 各模块测试
        run: |
          for m in protocol service settings-center reasoner memory images files qq shell timer batch approval approval-integration mcp; do
            echo "== 模块: $m =="
            if [[ "$m" == approval* ]]; then
              (cd "$m" && go test -v ./... -count=1 -timeout 300s)
            else
              (cd "$m" && go test ./... -count=1 -timeout 300s)
            fi
          done

      - name: 各模块静态检查（go vet）
        run: |
          for m in protocol service settings-center reasoner memory images files qq shell timer batch approval approval-integration mcp tests; do
            echo "== 模块: $m =="
            (cd "$m" && go vet ./...)
          done

      - name: 并发敏感模块（-race）
        run: |
          # 竞态在这一类代码里最贵：Fire 各自成 goroutine、SQLite 单连接、黑板上多把锁。
          # 普通 go test 能全绿而数据其实是坏的（并发去重那条就是），所以单独跑一遍。
          for m in protocol service settings-center memory reasoner approval shell timer batch qq mcp; do
            echo "== 模块: $m (-race) =="
            (cd "$m" && go test ./... -count=1 -timeout 900s -race)
          done

      - name: 端到端测试（真进程）
        run: |
          cd tests
          go test ./... -count=1 -timeout 600s

      - name: 脱离工作区构建（GOWORK=off）
        run: |
          for m in protocol service settings-center reasoner memory images files qq shell timer batch tests approval approval-integration mcp; do
            echo "== $m =="
            (cd "$m" && GOWORK=off go build ./...)
          done

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 门户全链路 e2e 需要 Go（起中心 / 记忆 / reasoner 真进程）
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查 + 构建（tsc + vite）
        working-directory: frontend
        run: npm run build

      - name: 测试（协议 / 中心链路 / HTTP API）
        working-directory: frontend
        run: npm test

      # 必须排在 build 之后：这两个 e2e 要门户的构建产物（缺产物时它们会 skip，
      # 所以上面 test 任务里的同名用例是 skip，这里是真跑）。
      # 这里把 skip 当成失败：套件“绿”但门户链路没跑，等于没验。
      - name: 门户全链路 e2e（真进程：中心 + 记忆 + reasoner + 门户 + 假 LLM）
        run: |
          set -o pipefail
          log=$(mktemp)
          go test ./tests -run 'TestPortalChainE2E|TestDeliveryFailureNoticeE2E' -count=1 -timeout 300s -v | tee "$log"
          if grep -Eq -- '--- SKIP|no tests to run' "$log"; then
            echo "门户 e2e 未真正执行（出现 SKIP 或 no tests to run）"
            exit 1
          fi

  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: embedding/pyproject.toml

      - name: 安装依赖（核心 + dev；不含 onnx extra——真模型冒烟在 CI 上跳过）
        run: pip install -e "./embedding[dev]"

      - name: 测试（协议锚定 / fake 后端 / 真 WS 集成）
        working-directory: embedding
        run: python -m pytest tests -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: 确认 Windows 专属分支所需的解释器
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          if (-not (Test-Path 'C:\Program Files\Git\bin\bash.exe')) { throw '缺少 Git Bash' }

      # Ubuntu 任务里这些分支会 skip：PowerShell 5.1 代码页、盘符路径、taskkill 等。
      - name: 审批与 shell 的 Windows 分支
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($m in @('approval', 'approval-integration', 'shell')) {
            Write-Host "== 模块: $m =="
            Push-Location $m
            go test ./... -count=1 -timeout 600s
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }

      - name: Windows 跨服务 e2e（专属路径）
        shell: pwsh
        run: |
          Set-Location tests
          go test ./... -run 'TestHelloWeb|TestShellHotPathE2E|TestTimerSleepWakeE2E|TestPowerShellScriptsKeepBOM' -count=1 -timeout 600s
