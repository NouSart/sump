<!doctype html>
<!-- SUMP 设置中心 · 版式样张 v2
     ①页面=表格：主列所有元素同一左轴、统一列宽；设置退为横向一行（表格化）
     ②唯一主体：96px 服务名；设置值 14px（仅为注释层，不抢视野）
     ③边栏=悬浮胶囊：白底细边微浮起、内容高不通高、sticky 跟随
     ④色彩克制：白/近黑/灰 + 唯一蓝（绿仅 7px 状态点）
     样式外链 specimen.css（内联 <style> 会被前端服务 CSP 屏蔽）。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUMP · 样张</title>
    <link rel="stylesheet" href="./specimen.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="capsule">
        <div class="brand">SUMP<small>设置中心</small></div>
        <nav>
          <p class="label">服务 · 05</p>
          <a class="svc on" href="#reasoner"><i></i>reasoner</a>
          <a class="svc" href="#memory"><i></i>memory</a>
          <a class="svc" href="#images"><i></i>images</a>
          <a class="svc" href="#qq"><i></i>qq</a>
          <a class="svc" href="#settings-center"><i></i>settings-center</a>
        </nav>
        <p class="foot"><b></b>已连接</p>
      </aside>

      <main class="main">
        <div class="canvas">
          <div class="mark"></div>
          <p class="eyebrow">服务 · 02 / 05</p>
          <h1>reasoner</h1>
          <p class="lede">LLM 单步推理：任务先经记忆服务托管，收到来自记忆的 resume 才完全启动。</p>
          <p class="addr">ws://127.0.0.1:19131/ws</p>

          <hr class="rule" />
          <h2>设置</h2>

          <div class="table">
            <div class="row head" aria-hidden="true">
              <span>键</span>
              <span>生效值</span>
              <span>默认值</span>
              <span>状态</span>
              <span class="end">操作</span>
            </div>
            <div class="row">
              <span class="key">tool.notify_mode</span>
              <span class="val">batch</span>
              <span class="def">each</span>
              <span class="chip">已覆盖</span>
              <span class="acts">
                <button class="btn" type="button">修改</button>
                <button class="link" type="button">重置</button>
              </span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
